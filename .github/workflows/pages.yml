# Publishes the 3D containment demo (site root) and the dashboard in fixture mode (/dashboard/).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build demo
        working-directory: demo
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build dashboard (fixture data)
        working-directory: dashboard
        env:
          VITE_MOCK: '1'
        run: |
          npm ci
          npx vite build --base ./ --outDir ../_site/dashboard --emptyOutDir

      - name: Assemble site
        run: cp demo/dist/containment-demo.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
