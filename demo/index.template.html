<meta name="claude:viewport-fit-sides" content="cover">
<title>CyberRange-Net Containment Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a white page with navy structure. The 3D model sits in a navy window like a screen.
   Red has one meaning everywhere: blocked or caught. Single light look by choice. */
:root {
  --white: #FFFFFF;
  --navy: #00008B;
  --red: #FF0000;
  --edge-dark: #000050;
  --soft: rgba(0, 0, 139, 0.72);
  --faint: rgba(0, 0, 139, 0.2);
  --wash: rgba(0, 0, 139, 0.05);
  --font: 'SN Pro', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
body {
  margin: 0; background: var(--white); color: var(--navy); font: 16px/1.55 var(--font);
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--font); text-wrap: balance; }
h1 { font-size: clamp(36px, 6.4vw, 78px); font-weight: 800; line-height: 0.98; letter-spacing: -0.025em; margin: 14px 0 0; max-width: 15ch; }
h1 .red-word { color: var(--red); }
h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; line-height: 1.05; letter-spacing: -0.015em; margin: 0 0 10px; }
h3 { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
p { margin: 8px 0; max-width: 64ch; }
.kicker { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
.kicker::before { content: ""; width: 14px; height: 14px; background: var(--red); flex: none; }
.kicker-bar { height: 6px; width: min(340px, 60%); background: var(--navy); margin: 20px 0 18px; }
.lede { color: var(--soft); font-size: 18px; max-width: 58ch; }
.small { color: var(--soft); font-size: 14px; }

/* Keys: a face on a visible edge. Motion drives tilt, lift and press; --edge colours the edge. */
.key {
  --edge: var(--navy);
  font: 700 15px/1.2 var(--font); color: var(--navy); background: var(--white);
  border: 2px solid var(--navy); border-radius: 6px; padding: 9px 14px;
  cursor: pointer; transform-style: preserve-3d; will-change: transform;
  -webkit-tap-highlight-color: transparent;
}
.key-solid { --edge: var(--edge-dark); background: var(--navy); color: var(--white); border-color: var(--navy); }
.key:disabled { opacity: 0.32; cursor: default; }
.key:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
select { font: 500 15px var(--font); color: var(--navy); background: var(--white); border: 2px solid var(--navy); border-radius: 6px; padding: 8px 10px; }

/* Stage: the navy model window and its narration */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); border: 2px solid var(--navy); margin-top: 18px; background: var(--white); transform-origin: center top; }
@media (min-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr) 400px; } }
.scene { position: relative; height: clamp(380px, 64vh, 660px); min-width: 0; overflow: hidden; background: var(--navy); color: var(--white); }
.scene canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.scene canvas:active { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 16px; max-width: calc(100% - 24px); font-size: 13px; font-weight: 600; pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; display: inline-block; box-sizing: border-box; }
.legend .k-solid { background: var(--white); }
.legend .k-outline { border: 2px solid var(--white); }
.legend .k-ring { border: 2px solid var(--white); border-radius: 50%; }
.legend .k-allow { background: var(--white); border-radius: 50%; width: 9px; height: 9px; }
.legend .k-block { background: var(--red); border-radius: 50%; width: 9px; height: 9px; }
.hint { position: absolute; right: 12px; top: 10px; margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.78); pointer-events: none; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

.panel { border-top: 2px solid var(--navy); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; background: var(--white); }
@media (min-width: 980px) { .panel { border-top: 0; border-left: 2px solid var(--navy); height: clamp(380px, 64vh, 660px); overflow-y: auto; box-sizing: border-box; } }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 6px; }
.pane { display: flex; flex-direction: column; gap: 12px; }
.pane h2 { font-size: 26px; margin: 0; }
.pane p { margin: 0; }
.stepno { font-size: 14px; font-weight: 700; color: var(--soft); }
.readout { background: var(--wash); border-left: 4px solid var(--navy); padding: 12px 14px; min-height: 96px; font-size: 15px; }
.readout .v { font-size: 22px; font-weight: 800; line-height: 1.1; transform-origin: left center; }
.readout .ok { color: var(--navy); }
.readout .bad { color: var(--red); }
.readout .wait { color: var(--soft); }
.readout .what { display: block; color: var(--soft); font-size: 14px; margin-top: 4px; }
.readout code { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--faint); font: 600 13.5px/1.5 var(--font); overflow-wrap: anywhere; }
.counts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin-top: 10px; }
.counts b { display: block; font-size: 30px; font-weight: 800; line-height: 1.05; }
.counts > div > span { color: var(--soft); font-size: 13px; }
.step-title { font-size: 24px; font-weight: 800; line-height: 1.15; margin: 0; }
.paused-tag { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); margin: 0; background: var(--white); color: var(--navy); font-size: 13px; font-weight: 800; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 3px; }
.field { display: grid; gap: 6px; font-size: 14px; font-weight: 700; }

/* Player: transport keys plus a segmented step track, spanning the full stage */
.player { grid-column: 1 / -1; border-top: 2px solid var(--navy); padding: 16px 18px 20px; display: grid; gap: 16px 24px; grid-template-columns: 1fr; align-items: center; background: var(--white); }
@media (min-width: 760px) { .player { grid-template-columns: auto minmax(0, 1fr); } }
.player-keys { display: flex; gap: 10px; align-items: center; }
.player-keys .key { height: 48px; min-width: 48px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.player-keys .play { min-width: 128px; font-size: 16px; }
.player-track { min-width: 0; display: grid; gap: 8px; }
.player-now { margin: 0; display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--soft); min-width: 0; }
.player-now b { color: var(--navy); font-size: 18px; font-weight: 800; }
.player-now span { color: var(--navy); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.track { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.seg { position: relative; height: 16px; padding: 0; border: 2px solid var(--navy); border-radius: 3px; background: var(--white); overflow: hidden; cursor: pointer; transition: transform 0.15s ease, height 0.15s ease; }
.seg:hover { transform: translateY(-2px); }
.seg.now { height: 22px; margin-top: -3px; }
.seg .fill { position: absolute; inset: 0; background: var(--navy); transform-origin: left center; transform: scaleX(0); }
.seg:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }

/* Landing */
.landing { position: relative; min-height: min(100svh, 940px); display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 40px; padding-block: 36px 72px; box-sizing: border-box; }
@media (min-width: 980px) { .landing { grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); align-items: center; } }
.landing h1 { font-size: clamp(42px, 7.4vw, 96px); margin-top: 18px; }
.landing .lede { margin-top: 22px; }
.land-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 30px; }
.land-actions .enter { font-size: 19px; padding: 17px 30px; }
.land-facts { display: flex; flex-wrap: wrap; gap: 18px 36px; margin: 40px 0 0; }
.land-facts div { display: flex; flex-direction: column-reverse; border-top: 4px solid var(--navy); padding-top: 8px; max-width: 15ch; }
.land-facts dd { margin: 0; font-size: 44px; font-weight: 800; line-height: 1; }
.land-facts dd.red { color: var(--red); }
.land-facts dt { margin-top: 6px; color: var(--soft); font-size: 14px; }
.mosaic-wrap { margin: 0; perspective: 1000px; min-width: 0; }
.mosaic { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; transform-style: preserve-3d; transform-origin: center bottom; }
.mosaic i { aspect-ratio: 1; background: var(--red); border-radius: 2px; }
.mosaic i.p { background: var(--navy); }
.mosaic i.s { background: transparent; box-shadow: inset 0 0 0 2px var(--faint); }
.mosaic-wrap figcaption { margin-top: 14px; color: var(--soft); font-size: 14px; max-width: 46ch; }
.scroll-cue { position: absolute; left: 0; bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--soft); }
.cue-line { width: 2px; height: 30px; background: var(--navy); display: inline-block; }

.model { padding-top: 24px; }
.model-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.model-head h2 { margin: 0; }

/* Custom scroller: styled scrollbars, a top progress bar, and a rail of section stops on wide screens */
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--white); }
::-webkit-scrollbar-thumb { background: var(--navy); border: 3px solid var(--white); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--red); }
@supports not selector(::-webkit-scrollbar) { html, .panel, .scroll { scrollbar-color: var(--navy) var(--white); scrollbar-width: thin; } }
.topbar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 4px; z-index: 30; pointer-events: none; }
.topbar span { display: block; height: 100%; background: var(--red); transform-origin: left center; transform: scaleX(0); }
.rail { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 22px; padding: 6px 0; }
@media (min-width: 1360px) { .rail { display: flex; } }
.rail-track { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--faint); }
.rail-track span { position: absolute; inset: 0; background: var(--navy); transform-origin: top center; transform: scaleY(0); }
.rail-stop { position: relative; width: 16px; height: 16px; padding: 0; border: 2px solid var(--navy); border-radius: 3px; background: var(--white); cursor: pointer; transition: transform 0.18s ease, background 0.18s ease; }
.rail-stop:hover { transform: scale(1.25); }
.rail-stop.on { background: var(--navy); transform: scale(1.15); }
.rail-stop:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
.rail-name { position: absolute; right: 26px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 13px; font-weight: 700; color: var(--navy); background: var(--white); padding: 2px 8px; border: 2px solid var(--navy); border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.rail-stop:hover .rail-name, .rail-stop:focus-visible .rail-name { opacity: 1; }
.nowrap { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .seg, .rail-stop, .rail-name { transition: none; } }
.field select { width: 100%; }

/* Evidence */
section.ev { margin-top: 76px; }
section.ev > p { color: var(--soft); }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 28px; margin-top: 24px; }
.figure { border-top: 4px solid var(--navy); padding: 12px 0 18px; }
.figure b { display: block; font-size: clamp(42px, 5vw, 62px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.figure b.red { color: var(--red); }
.figure:has(b.red) { border-top-color: var(--red); }
.figure span { display: block; margin-top: 8px; color: var(--soft); font-size: 15px; }
.box { margin-top: 22px; min-width: 0; }
.probes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.scroll { overflow-x: auto; padding-bottom: 4px; }
table.heat { border-collapse: separate; border-spacing: 4px; font-size: 13px; }
table.heat th { font-weight: 700; color: var(--soft); text-align: left; white-space: nowrap; padding: 2px 8px 2px 0; }
table.heat th.v { writing-mode: vertical-rl; transform: rotate(180deg); padding: 6px 2px; }
table.heat td { width: 38px; height: 32px; text-align: center; font-weight: 800; font-size: 15px; border-radius: 3px; }
table.heat td button { display: block; width: 100%; height: 32px; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
table.heat td.p { background: var(--navy); color: var(--white); }
table.heat td.d { background: var(--red); color: var(--white); }
table.heat td.s { background: transparent; border: 2px dashed var(--faint); }
table.heat td.sel { box-shadow: 0 0 0 3px var(--white), 0 0 0 6px var(--navy); }
.cellinfo { min-height: 3em; font-size: 15px; font-weight: 500; }
.rows { list-style: none; padding: 0; margin: 0; border-top: 4px solid var(--navy); }
.rows li { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--faint); }
.stamp { flex: none; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; padding: 4px 10px; border-radius: 3px; }
.stamp.pass { background: var(--navy); color: var(--white); }
.stamp.caught { background: var(--red); color: var(--white); }
.tamper { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; padding: 16px 0; border-bottom: 1px solid var(--faint); }
.tamper .stamp { align-self: start; margin-top: 2px; }
.tamper p { margin: 0; font-weight: 600; }
.tamper .what { grid-column: 2; color: var(--soft); font-size: 14px; font-weight: 400; }
details { margin-top: 24px; }
summary { cursor: pointer; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.acls { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); margin-top: 14px; }
.acls h4 { margin: 0 0 6px; font-size: 14px; font-weight: 800; }
pre { font: 500 13px/1.6 var(--font); color: var(--white); background: var(--navy); padding: 10px 12px; margin: 0; overflow-x: auto; white-space: pre; border-radius: 3px; }
.two { display: grid; gap: 28px; grid-template-columns: 1fr; margin-top: 22px; }
@media (min-width: 820px) { .two { grid-template-columns: 1fr 1fr; } }
.two > div { border-top: 4px solid var(--navy); padding-top: 12px; }
.two .no { border-top-color: var(--red); }
.two ul { margin: 0; padding-left: 20px; }
.two li { margin: 8px 0; }
footer { margin-top: 76px; padding-top: 14px; border-top: 2px solid var(--navy); color: var(--soft); font-size: 14px; }
</style>

<div id="root"></div>
<script>/*__APP__*/</script>
